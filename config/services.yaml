# config/services.yaml
# Este archivo configura los servicios de Symfony y nuestros propios servicios personalizados.
# =========================================================================================

parameters:
    # Nombre de la BD MongoDB tomado de variables de entorno (.env)
    mongo_db_name: '%env(string:MONGO_DB)%' 
    
    # Carpeta pública donde se guardarán las fotos de los inmuebles (Estructura original)
    bienes_images_directory: '%kernel.project_dir%/public/uploads/bienes'

    
    # Carpeta PRIVADA y PROTEGIDA para documentos legales (Fuera de /public)
    propietarios_documentos_directory: '%kernel.project_dir%/var/documents'

    # CORRECCIÓN DE PARÁMETRO: Ruta requerida por ProprietaireController para la subida de fotos
    fotos_directory: '%kernel.project_dir%/public/uploads/fotos'

services:
    # === Configuración por defecto para todos los servicios de este archivo ===
    _defaults:
        autowire: true      # Inyección automática de dependencias en constructores
        autoconfigure: true # Symfony registra automáticamente tags según el tipo de clase

    # === Registro automático de todas las clases de /src como servicios ===
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # === Servicio especializado para la carga de imágenes (Inmuebles/Bienes) ===
    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%bienes_images_directory%'
            # Nota: SluggerInterface se inyecta automáticamente gracias a autowire: true

    # === Servicio MongoDB\Client ===
    # Permite conectar con MongoDB usando la librería oficial.
    MongoDB\Client:
        class: MongoDB\Client
        arguments:
            - '%env(string:MONGO_URI)%' # URI de conexión a MongoDB definida en .env

    # === Servicio personalizado para registrar contactos en MongoDB ===
    # SOLUCIÓN CRÍTICA: Quitamos el nombre de variable estricto y le pasamos los 
    # argumentos en orden posicional exacto para evitar conflictos con el constructor.
    App\Service\MongoContactLogger:
        arguments:
            - '@MongoDB\Client'
            - '%mongo_db_name%'