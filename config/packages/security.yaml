security:
    # Casilla de verificación de contraseñas segura y automática
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # JERARQUÍA DE ROLES: Solución interna para evitar bloqueos del Administrador
    role_hierarchy:
        ROLE_PROPRIETAIRE: ROLE_CLIENT
        ROLE_ADMIN:        [ROLE_PROPRIETAIRE, ROLE_CLIENT]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: home  # Asegúrate de que la ruta de tu página de inicio se llame exactamente 'home' en tu controlador

    access_control:
        # === ACCESO POR ROLES DEFINIDO (Ordenado de lo más específico a lo más general) ===

        # 1. Rutas administrativas totalmente restringidas al hermano del desarrollador
        - { path: ^/admin, roles: ROLE_ADMIN }

        # 2. Rutas exclusivas para la gestión de inmuebles de dueños (Dashboard y creación de bienes)
        - { path: ^/proprietaire, roles: ROLE_PROPRIETAIRE }

        # 3. Rutas exclusivas del panel del cliente (favoritos, alertas)
        - { path: ^/client, roles: ROLE_CLIENT }

        # 4. BLINDAJE PÚBLICO: Garantiza que la vitrina y los detalles de inmuebles sean siempre visibles sin loguearse
        - { path: ^/bien, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # 5. Punto de entrada de la aplicación y páginas estáticas de la landing (Nosotros, contacto, etc.)
        - { path: ^/$, roles: PUBLIC_ACCESS }

        # NOTA DE SEGURIDAD INTERNA: Si en el futuro deseas bloquear toda la aplicación, 
        # asegúrate de dejar esta línea siempre al final de la lista.
        #- { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10